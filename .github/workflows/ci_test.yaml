name: Offline Python checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-contracts:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,service]'

      - name: Run service and storage contract tests
        run: >-
          python -m pytest
          tests/security/test_secret_scan.py
          tests/service/test_bootstrap.py
          tests/service/test_api_contracts.py
          tests/service/test_process_stderr.py
          tests/service/test_process_stop.py
          tests/cli/test_service.py
          tests/report/test_report_endpoints.py
          tests/report/test_report_meta_cache.py
          tests/perf/test_perf_archive.py
